name: Go tests

on:
  push:
    branches:
      - main
      - master
      - 'bugfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - 'bugfix/**'
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...
